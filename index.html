<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrousel Kapps</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .carousel {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;

      /* Fond inspiré des overlays Kapps */
      background: linear-gradient(180deg, rgba(36, 40, 47, 0.70), rgba(17, 20, 25, 0.70));
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.38),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .carousel::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.055), transparent 44%),
        linear-gradient(90deg, rgba(255,255,255,0.015), transparent 20%, transparent 80%, rgba(255,255,255,0.015));
      z-index: 1;
    }

    .carousel img {
      position: absolute;
      inset: 8%;
      width: 84%;
      height: 84%;
      object-fit: contain;
      opacity: 0;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.35));
      transition: opacity 0.8s ease-in-out;
      z-index: 2;
    }

    .carousel img.active {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="carousel">
    <img src="01-grid-and-go.png" class="active" alt="">
    <img src="02-pasta-bianca.png" alt="">
    <img src="03-partner-1.png" alt="">
    <img src="04-scuderia.png" alt="">
    <img src="05-rs-simulation.png" alt="">
  </div>

  <script>
    const images = [...document.querySelectorAll(".carousel img")];
    let current = 0;

    setInterval(() => {
      images[current].classList.remove("active");
      current = (current + 1) % images.length;
      images[current].classList.add("active");
          }, 5000);
  </script>
</body>
</html>
