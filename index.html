<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrousel sponsors</title>

  <style>
    :root {
      --theme-bg-color: hsla(0, 0%, 6%, 0.8);
      --border-radius: 6px;
      --transition-duration: 800ms;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--theme-bg-color);
      border-radius: var(--border-radius);
    }

    .slide {
      position: absolute;
      inset: 8%;
      width: 84%;
      height: 84%;
      object-fit: contain;
      opacity: 0;
      transition: opacity var(--transition-duration) ease-in-out;
      pointer-events: none;
      user-select: none;
    }

    .slide.is-active {
      opacity: 1;
    }
  </style>
</head>

<body>
  <main id="app" aria-label="Carrousel des sponsors">
    <img class="slide is-active" src="01-grid-and-go.png" alt="Grid and Go">
    <img class="slide" src="02-pasta-bianca.png" alt="Pasta Bianca">
    <img class="slide" src="03-p1sim.png" alt="P1SIM">
    <img class="slide" src="04-superchicane.png" alt="SuperChicane">
    <img class="slide" src="05-rs-simulation.png" alt="RS Simulation">
  </main>

  <script>
    (() => {
      "use strict";

      const params = new URLSearchParams(window.location.search);
      const opacityValue = Number.parseFloat(params.get("bgOpacity"));

      if (Number.isFinite(opacityValue)) {
        const clampedOpacity = Math.min(1, Math.max(0, opacityValue));
        document.documentElement.style.setProperty(
          "--theme-bg-color",
          `hsla(0, 0%, 6%, ${clampedOpacity})`
        );
      }

      const slides = Array.from(document.querySelectorAll(".slide"));

      if (slides.length < 2) {
        return;
      }

      let currentIndex = 0;

      window.setInterval(() => {
        slides[currentIndex].classList.remove("is-active");
        currentIndex = (currentIndex + 1) % slides.length;
        slides[currentIndex].classList.add("is-active");
      }, 5000);
    })();
  </script>
</body>
</html>
